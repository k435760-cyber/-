<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Galaxy OS 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 30% 20%,#262b3f,#0a0b0f 70%);font-family:"SamsungOne","Samsung Sans","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;letter-spacing:-.2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;user-select:text;-webkit-user-select:text;letter-spacing:inherit}
svg{display:block}

/* ---------- device frame ---------- */
.device{position:relative;width:392px;height:850px;border-radius:56px;background:#0c0c0e;padding:10px;box-shadow:0 0 0 2px #3a3a40,0 0 0 5px #151518,0 40px 90px rgba(0,0,0,.6);transform-origin:center;flex:none}
.device .hw{position:absolute;right:-7px;width:5px;background:#2c2c32;border-radius:0 3px 3px 0;cursor:pointer}
.device .hw:active{background:#55555c}
.device .hw.volup{top:168px;height:48px;border-radius:0 3px 0 0}
.device .hw.voldn{top:217px;height:48px;border-radius:0 0 3px 0}
.device .hw.power{top:290px;height:66px}
.phone{--bg:#f6f6f6;--surface:#fff;--surface2:#ececee;--text:#0f0f0f;--sub:#7b7b80;--line:rgba(0,0,0,.075);--accent:#387cff;--accent2:#e9f0ff;--danger:#f23f3f;--ok:#2fb35a;--kb-bg:#eeeef0;--key:#fff;--key-fn:#dcdce0;--key-text:#151515;--shade:rgba(242,242,244,.86);--qbtn:#fff;--glass:rgba(255,255,255,.72);
  position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000;color:var(--text);isolation:isolate;font-size:calc(16px * var(--fs,1))}
.phone[data-theme=dark]{--bg:#000;--surface:#171717;--surface2:#272727;--text:#f6f6f6;--sub:#8e8e93;--line:rgba(255,255,255,.09);--accent:#4f8dff;--accent2:#14243f;--kb-bg:#121212;--key:#2d2d2f;--key-fn:#1f1f21;--key-text:#f2f2f2;--shade:rgba(16,16,16,.86);--qbtn:#2a2a2c;--glass:rgba(40,40,42,.72)}
@media (max-width:520px),(max-height:640px){
  body{display:block}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none!important}
  .device .hw,.punch{display:none}
  .phone{border-radius:0}
}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .4s}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:95;opacity:0}

/* ---------- stage ---------- */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:34px}
.content{position:relative;flex:1;min-height:0}
.layer{position:absolute;inset:0}
.statusbar{position:absolute;top:0;left:0;right:0;height:34px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:2px 24px 0 28px;font-size:13.5px;font-weight:500;color:#fff;cursor:pointer;touch-action:none;transition:color .2s,background .2s;letter-spacing:0}
.phone.in-app .statusbar{background:var(--bg);color:var(--text)}
.phone.shade-open .statusbar{background:none;color:var(--text);opacity:0}
.statusbar .l,.statusbar .r{display:flex;align-items:center;gap:4px}
.statusbar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.statusbar .nicons{display:flex;gap:3px;margin-left:4px}.statusbar .nicons svg{width:12px;height:12px;opacity:.85}
.sig{display:flex;align-items:flex-end;gap:1.5px;height:12px}.sig i{width:3px;background:currentColor;border-radius:1px;display:block}.sig i.o{opacity:.3}
.net{font-size:10px;font-weight:700;margin-right:-1px}
.batt{display:flex;align-items:center;gap:3px;font-size:12px}
.batt i{position:relative;width:23px;height:12px;border:1.4px solid currentColor;border-radius:3.5px;display:block;opacity:.95}
.batt i::after{content:"";position:absolute;right:-3.8px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.batt b{position:absolute;left:1.2px;top:1.2px;bottom:1.2px;background:currentColor;border-radius:1.5px}
.punch{position:absolute;top:10px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#050506;z-index:200;box-shadow:inset 0 0 0 2px #121216;pointer-events:none}
.navbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-around;padding:0 34px;color:#fff;position:relative;z-index:30;transition:background .2s,color .2s}
.phone.in-app .navbar{background:var(--bg);color:var(--text)}
.phone.kb-open .navbar{background:var(--kb-bg);color:var(--text)}
.navbar button{width:64px;height:40px;display:grid;place-items:center;border-radius:20px}
.navbar button:active{background:rgba(128,128,128,.22)}
.navbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app icons (One UI squircle) ---------- */
.ic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;min-width:0;letter-spacing:-.3px}
.ic span{max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{--c:#888;width:56px;height:56px;border-radius:30%;display:grid;place-items:center;flex:none;transition:transform .14s;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.32),rgba(255,255,255,0) 60%),linear-gradient(170deg,var(--c),color-mix(in srgb,var(--c) 78%,#000));box-shadow:0 2px 6px rgba(0,0,0,.14)}
.ic:active .sq{transform:scale(.88)}
.sq svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sq.sm{width:38px;height:38px}.sq.sm svg{width:20px;height:20px}
.sq.xs{width:24px;height:24px;box-shadow:none}.sq.xs svg{width:14px;height:14px;stroke-width:2.2}
.calic{display:flex;flex-direction:column;align-items:center;line-height:1;color:#fff}
.calic small{font-size:9px;font-weight:600;opacity:.9;letter-spacing:.5px}
.calic b{font-size:24px;font-weight:600;margin-top:2px;letter-spacing:-1px}
.sq.sm .calic small{font-size:6px}.sq.sm .calic b{font-size:15px}.sq.xs .calic small{display:none}.sq.xs .calic b{font-size:11px;margin:0}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;touch-action:none}
.pager{flex:1;position:relative;overflow:hidden;min-height:0}
.strip{position:absolute;inset:0;display:flex;transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.hpage{flex:none;width:100%;height:100%;padding:8px 12px 0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:0 2px}
.hpage .ic{grid-row:span 1}
.widget{grid-column:1/-1;grid-row:span 2;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.28);cursor:pointer}
.widget .t{font-size:62px;font-weight:300;letter-spacing:-2px;line-height:1}
.widget .d{font-size:14px;margin-top:6px;opacity:.95}
.widget .wx{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.widget .wx .ti{font-size:34px;font-weight:300;display:flex;align-items:center;gap:6px}
.widget .wx .ti span{font-size:30px}
.widget .wx small{font-size:12.5px;opacity:.9}
.wsearch{grid-column:1/-1;align-self:center;display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:rgba(255,255,255,.88);color:#555;padding:0 18px;font-size:15px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.wsearch svg{width:20px;height:20px;stroke:#555;fill:none;stroke-width:2.2;stroke-linecap:round}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;height:22px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.45;transition:opacity .2s,transform .2s;display:block}
.dots i.on{opacity:1;transform:scale(1.15)}
.dots.dark i{background:var(--text)}
.dock{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px 6px;flex:none}
.dock .ic span{display:none}

/* ---------- apps screen ---------- */
#drawer{background:rgba(8,8,12,.38);backdrop-filter:blur(30px) saturate(1.25);-webkit-backdrop-filter:blur(30px) saturate(1.25);transform:translateY(40px);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s;display:flex;flex-direction:column;z-index:5;visibility:hidden;touch-action:none}
#drawer.open{transform:none;opacity:1;visibility:visible}
.dr-head{padding:12px 16px 4px;flex:none}
.dr-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border-radius:26px;padding:0 6px 0 18px;color:#fff;height:46px}
.dr-search>svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.1;flex:none;stroke-linecap:round}
.dr-search input{flex:1;border:0;outline:0;background:none;color:#fff;font-size:16px;padding:0;min-width:0}
.dr-search input::placeholder{color:rgba(255,255,255,.78)}
.dr-search .ibtn{color:#fff;width:38px;height:38px}
.dr-page{flex:none;width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);padding:4px 10px}
.dr-results{flex:1;overflow-y:auto;padding:10px 14px;touch-action:pan-y}
.dr-results .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 2px}
.dr-results .sect{color:rgba(255,255,255,.8);font-size:13px;font-weight:600;margin:6px 6px 14px}
.dr-results .rrow{display:flex;align-items:center;gap:12px;padding:10px 8px;color:#fff;border-radius:14px;cursor:pointer;font-size:15px}
.dr-results .rrow small{display:block;opacity:.7;font-size:12px}
.dr-empty{text-align:center;color:rgba(255,255,255,.75);padding:40px 0;font-size:14px}

/* ---------- edge panel ---------- */
.edge-h{position:absolute;right:0;top:26%;width:7px;height:96px;border-radius:5px 0 0 5px;background:rgba(255,255,255,.55);z-index:24;cursor:pointer;box-shadow:0 0 6px rgba(0,0,0,.15);touch-action:none}
.edge-h::before{content:"";position:absolute;inset:-6px -2px -6px -18px}
.phone.in-app .edge-h{background:rgba(128,128,128,.45)}
.phone.kb-open .edge-h,.phone.locked .edge-h{display:none}
#edge{position:absolute;inset:0;z-index:26;display:none}
#edge.open{display:block}
#edge .ep{position:absolute;right:10px;top:15%;width:86px;border-radius:28px;background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);padding:16px 0 10px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:edgeIn .26s cubic-bezier(.2,.8,.2,1)}
#edge .ic{color:var(--text);text-shadow:none;font-size:11px}
#edge .ic .sq{width:48px;height:48px}#edge .ic .sq svg{width:24px;height:24px}
#edge .ep .tl{font-size:11px;color:var(--sub);margin-top:4px}
@keyframes edgeIn{from{transform:translateX(110%)}}

/* ---------- One UI app chrome ---------- */
#apps{z-index:10;pointer-events:none}
.app{position:absolute;inset:0;background:var(--bg);color:var(--text);display:none;pointer-events:auto;overflow:hidden}
.app.active{display:block}
.app.opening{animation:appIn .32s cubic-bezier(.2,.85,.25,1)}
.app.closing{animation:appOut .24s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes appIn{from{transform:scale(.18);opacity:0;border-radius:60px}40%{opacity:1}to{transform:none;border-radius:0}}
@keyframes appOut{to{transform:scale(.18);opacity:0;border-radius:60px}}
.view{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.view.pushin{animation:pushIn .3s cubic-bezier(.2,.85,.25,1)}
.view.popout{animation:popOut .22s ease-in forwards}
@keyframes pushIn{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes popOut{to{transform:translateX(30%);opacity:0}}
.ou-sc{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;min-height:0;scrollbar-width:none}
.ou-sc::-webkit-scrollbar{display:none}
.ou-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px 0;text-align:center;overflow:hidden}
.ou-hero h1{font-size:31px;font-weight:400;letter-spacing:-.6px;line-height:1.2}
.ou-hero .sub{font-size:14px;color:var(--sub);margin-top:8px;min-height:0}
.ou-hero .sub:empty{display:none}
.ou-bar{position:sticky;top:0;z-index:3;height:56px;display:flex;align-items:center;padding:0 4px 0 6px;background:var(--bg);gap:0}
.ou-bar .t{flex:1;font-size:20px;font-weight:600;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.ou-body{padding:0 12px 24px}
.bar{height:56px;display:flex;align-items:center;padding:0 4px;gap:0;flex:none}
.bar .title{flex:1;font-size:19px;font-weight:600;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-body{flex:1;overflow-y:auto;padding:0 12px 24px;overscroll-behavior:contain;position:relative}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text)}
.ibtn:active{background:var(--surface2)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:26px;overflow:hidden;margin-bottom:14px}
.card-t{font-size:13.5px;color:var(--accent);padding:16px 22px 4px;font-weight:600}
.grp-t{font-size:13.5px;color:var(--sub);padding:14px 22px 8px;font-weight:600}
.row{display:flex;align-items:center;gap:16px;padding:15px 22px;min-height:60px;cursor:pointer;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;background:var(--line)}
.row.ind+.row::before,.row+.row.ind::before{left:72px}
.row:active{background:var(--surface2)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--sub);font-size:13.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small.on{color:var(--accent)}
.row .meta{font-size:12.5px;color:var(--sub);flex:none}
.row .vdiv{width:1px;height:28px;background:var(--line);flex:none}
.sic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.sic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.switch{width:44px;height:24px;border-radius:12px;background:transparent;border:2px solid #9a9aa0;position:relative;flex:none;transition:background .2s,border-color .2s;cursor:pointer}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#9a9aa0;transition:transform .2s,background .2s,width .2s,height .2s,top .2s,left .2s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(18px);left:2px;top:2px;width:16px;height:16px;background:#fff}
.fab{position:absolute;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:4}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.field{width:100%;border:0;outline:0;background:var(--surface);border-radius:18px;padding:13px 18px;font-size:16px;color:var(--text)}
.field.ul{background:none;border-radius:0;border-bottom:1.5px solid var(--line);padding:12px 4px}
.field.ul:focus{border-bottom-color:var(--accent);box-shadow:none}
.field:focus{box-shadow:0 0 0 1.5px var(--accent) inset}
.searchf{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:24px;padding:0 16px;height:46px;margin:0 4px 14px}
.searchf svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2.2;flex:none;stroke-linecap:round}
.searchf input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0;color:var(--text)}
textarea.field{resize:none;line-height:1.5}
.pill{background:var(--accent);color:#fff;border-radius:24px;padding:11px 22px;font-weight:600;font-size:15px}
.pill.ghost{background:var(--surface2);color:var(--text)}
.pill.red{background:var(--danger)}
.tbtn{color:var(--accent);font-weight:600;font-size:15px;padding:10px 14px;border-radius:20px}
.tbtn:active{background:var(--surface2)}
.tabbar{display:flex;flex:none;background:var(--bg);padding:2px 10px 4px}
.tabbar button{flex:1;padding:13px 0 12px;font-size:14.5px;color:var(--sub);font-weight:500;position:relative}
.tabbar button.on{color:var(--text);font-weight:700}
.tabbar button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:5px;height:2.5px;border-radius:2px;background:var(--text)}
.empty{color:var(--sub);text-align:center;padding:50px 10px;font-size:15px;line-height:1.6;white-space:pre-line}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;font-size:18px;flex:none}
.av.lg{width:100px;height:100px;font-size:42px}
.seg{display:flex;background:var(--surface2);border-radius:22px;padding:3px;gap:2px}
.seg button{flex:1;border-radius:19px;padding:8px 0;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
input[type=range]{width:100%;accent-color:var(--accent)}
.oslider{position:relative;height:30px;display:flex;align-items:center;touch-action:none;cursor:pointer;flex:1}
.oslider .tr{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:var(--surface2)}
.oslider .fi{position:absolute;left:0;height:6px;border-radius:3px;background:var(--accent)}
.oslider .th{position:absolute;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ---------- Samsung keyboard ---------- */
#kb{display:none;background:var(--kb-bg);color:var(--key-text);padding:0 3px 2px;touch-action:none;flex:none;position:relative;z-index:30}
#kb.show{display:block}
.kb-tool{height:44px;display:flex;align-items:center;gap:0;padding:0 2px}
.kb-tool button{width:46px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--key-text)}
.kb-tool button.on{background:var(--key-fn);color:var(--accent)}
.kb-tool button.rec{color:#fff;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.kb-tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kb-tool .lbl{flex:1;text-align:center;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.kb-rows{display:flex;flex-direction:column;gap:9px;padding:2px 0 7px}
.kb-row{display:flex;gap:5px}
.kb-sp{flex:.5}
.key{flex:1;height:44px;border-radius:8px;background:var(--key);color:var(--key-text);font-size:22px;display:grid;place-items:center;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.12);cursor:pointer;min-width:0;font-weight:400}
.key .alt{position:absolute;top:2px;right:5px;font-size:10.5px;color:var(--sub);line-height:1}
.key.fn{background:var(--key-fn);font-size:14px;font-weight:500}
.key.wide{flex:1.45}.key.space{flex:4;font-size:13px;color:var(--sub)}
.key svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.key.down{filter:brightness(.86)}
.phone[data-theme=dark] .key.down{filter:brightness(1.4)}
.key.ch.down::after{content:attr(data-c);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:46px;height:56px;padding:0 6px;border-radius:12px;background:var(--key);color:var(--key-text);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 18px rgba(0,0,0,.28);pointer-events:none;z-index:5}
.key.ch.long::after{content:attr(data-a);background:var(--accent);color:#fff}
.key.shift.on{color:var(--accent)}

.qp-list{flex:1;overflow-y:auto;padding:4px 12px 10px;touch-action:pan-y}
.noti{background:var(--surface);border-radius:24px;padding:14px 18px;margin-bottom:6px;display:flex;gap:12px;cursor:pointer;align-items:flex-start}

/* recents */

#lock{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;color:#fff;touch-action:none;transition:transform .3s,opacity .3s,filter .3s;cursor:grab;background-size:cover}

#off{position:absolute;inset:0;background:#000;z-index:99;display:none;cursor:pointer}
#off.show{display:block}
#pmenu{position:absolute;inset:0;z-index:97;background:rgba(0,0,0,.55);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff}

#pmenu svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#volp{position:absolute;right:10px;top:130px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;width:60px;padding:14px 0 10px;border-radius:30px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 30px rgba(0,0,0,.22);transform:translateX(90px);transition:transform .25s cubic-bezier(.2,.85,.25,1);color:var(--text)}
#volp.show{transform:none}

#volp .ibtn{width:40px;height:40px}

@keyframes bootIn{from{opacity:0;letter-spacing:30px}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ==========================================================================
   One UI 9.5 layer: frosted glass, floating bars, editable quick panel
   ========================================================================== */
.phone{--gl:rgba(255,255,255,.58);--gl-b:rgba(255,255,255,.7);--gl-hi:rgba(255,255,255,.55);--gl-s:0 10px 34px rgba(0,0,0,.14);--ease:cubic-bezier(.22,1,.36,1)}
.phone[data-theme=dark]{--gl:rgba(44,44,48,.55);--gl-b:rgba(255,255,255,.12);--gl-hi:rgba(255,255,255,.08);--gl-s:0 10px 34px rgba(0,0,0,.45)}
.glass{background:var(--gl);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--gl-b);box-shadow:var(--gl-s),inset 0 1px 0 var(--gl-hi)}
#toast{background:var(--gl);color:var(--text);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--gl-b)}
.phone[data-theme=dark] #toast{background:var(--gl);color:var(--text)}
#ctx{background:var(--gl);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid var(--gl-b)}
.dlg{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--gl-b)}
#headsup .noti,.lk-notis .noti{background:var(--gl);color:var(--text);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--gl-b)}
.lk-notis .noti p,.lk-notis .noti .tm,.lk-notis .noti .ap{color:var(--sub)}
.ou-bar{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
/* smoother, springier motion */
.app.opening{animation:appIn .42s var(--ease)}
.view.pushin{animation:pushIn .38s var(--ease)}
#drawer{transition:transform .38s var(--ease),opacity .26s}
/* depth: the home screen recedes behind apps, the apps screen and the lock screen */
#home{transition:transform .42s var(--ease),opacity .3s,filter .3s}
.phone.drawer-open #home{transform:scale(.93);opacity:.35;filter:blur(6px)}
.phone.in-app #home{transform:scale(.92);opacity:.5}
.phone.locked #home{transform:scale(1.12);opacity:0}
#wall{transition:background .4s,transform .6s var(--ease),filter .4s}
.phone.drawer-open #wall,.phone.shade-open #wall{transform:scale(1.04)}

/* floating pill tab bar (One UI 8.5+) */
.ftab{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:34px;z-index:6}
.ftab button{min-width:62px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--sub);transition:background .2s,color .2s;padding:0 14px}

.ftab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.has-ftab{padding-bottom:78px!important}
.has-ftab>.view{padding-bottom:76px}
/* bottom search pill (One UI 8.5 Settings) */
.bsearch{position:absolute;left:16px;right:16px;bottom:14px;height:52px;border-radius:26px;display:flex;align-items:center;gap:10px;padding:0 20px;z-index:6;color:var(--sub);font-size:16px;cursor:pointer}
.bsearch svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round}

/* minimal sliders (One UI 9) */
.oslider .tr{height:4px;border-radius:2px}
.oslider .fi{height:4px;border-radius:2px}
.oslider .th{width:16px;height:16px;margin-left:-8px;border:0;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}

/* quick panel tiles */
#shade .bgd{background:color-mix(in srgb,var(--shade) 70%,transparent);backdrop-filter:blur(40px) saturate(1.5);-webkit-backdrop-filter:blur(40px) saturate(1.5)}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:78px;grid-auto-flow:row dense;gap:10px;padding:2px 2px 6px}
.qt{position:relative;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--text);min-width:0;padding:0 4px;transition:background .2s,color .2s,transform .2s}
.qt>svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.qt span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt.on{background:var(--accent);color:#fff;border-color:transparent}
.qt.w{grid-column:span 2;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 16px;text-align:left}
.qt.w .tx{min-width:0}.qt.w b{display:block;font-size:14.5px;font-weight:600}.qt.w small{display:block;font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt.sl{padding:0;overflow:hidden;cursor:ns-resize;touch-action:none}
.qt.sl.h{grid-column:span 4;cursor:ew-resize}
.qt.sl.v{grid-row:span 3}
.qt.sl .f{position:absolute;left:0;bottom:0;background:var(--accent);transition:height .06s,width .06s}
.qt.sl.v .f{right:0}.qt.sl.h .f{top:0}
.qt.sl .ico{position:absolute;color:#fff}
.qt.sl.low .ico{color:var(--text)}
.qt.sl.v .ico{bottom:16px;left:50%;transform:translateX(-50%)}.qt.sl.h .ico{left:18px;top:50%;transform:translateY(-50%)}
.qt.sl .ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.qt.sl .pct{position:absolute;font-size:12px;font-weight:600;color:var(--sub)}
.qt.sl.v .pct{top:12px;left:0;right:0;text-align:center}.qt.sl.h .pct{right:18px;top:50%;transform:translateY(-50%)}
.qedit .qt{animation:wiggle .35s ease-in-out infinite alternate}
.qedit .qt:nth-child(2n){animation-delay:.12s}
@keyframes wiggle{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.qb{position:absolute;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}

.qb.rm{top:-4px;left:-4px;background:var(--danger);color:#fff}.qb.rs{top:-4px;right:-4px}.qb.mv{bottom:-4px;left:-4px}
.qadd{display:flex;flex-wrap:wrap;gap:8px;padding:6px 2px 4px}

.qadd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.qedit-bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-size:13px;color:var(--sub)}

/* Now Bar on the lock screen */

/* app icon: One UI squircle; calendar and clock icons are live */
function iconInner(id) {

  if (id === 'clock') {

    const hx = 12 + 4.2 * Math.sin(ha), hy = 12 - 4.2 * Math.cos(ha), mx = 12 + 6.2 * Math.sin(ma), my = 12 - 6.2 * Math.cos(ma);

/* One UI style slider */
function oslider(value, min, max, oninput) {
  const tr = h('div', { class: 'tr' }), fi = h('div', { class: 'fi' }), th = h('div', { class: 'th' });
  const el = h('div', { class: 'oslider', role: 'slider' }, tr, fi, th);
  let v = value;
  const paint = () => { const p = (v - min) / (max - min) * 100; fi.style.width = p + '%'; th.style.left = p + '%'; };
  const at = e => { const r = el.getBoundingClientRect(); v = Math.round(min + clamp((e.clientX - r.left) / r.width, 0, 1) * (max - min)); paint(); oninput(v); };
  el.addEventListener('pointerdown', e => {
    e.stopPropagation(); at(e);
    const mv = ev => at(ev), up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
  el._set = nv => { v = nv; paint(); };
  paint();
  return el;
}

/* ---------- horizontal pager (home & apps screen) ---------- */
function makePager(container, dotsEl, { onVertical, filter } = {}) {
  const strip = h('div', { class: 'strip' });
  container.append(strip);
  let page = 0, count = 0;
  const go = (i, anim = true) => {
    page = clamp(i, 0, count - 1);
    strip.style.transition = anim ? '' : 'none';
    strip.style.transform = `translateX(${-page * 100}%)`;
    dotsEl.innerHTML = '';
    if (count > 1) for (let k = 0; k < count; k++) dotsEl.append(h('i', { class: k === page ? 'on' : '' }));
  };
  let axis = null;
  drag(container, {
    filter: e => !filter || filter(e),
    start: () => { axis = null; },
    move: (dx, dy) => {
      if (!axis && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (axis === 'x') {
        const edge = (page === 0 && dx > 0) || (page === count - 1 && dx < 0) ? 0.3 : 1;
        strip.style.transition = 'none';
        strip.style.transform = `translateX(calc(${-page * 100}% + ${dx * edge}px))`;
      }
    },
    end: (dx, dy, moved) => {
      if (axis === 'x') go(dx < -50 ? page + 1 : dx > 50 ? page - 1 : page);
      else if (axis === 'y' && moved && onVertical) onVertical(dy);
      axis = null;
    },
  });
  container.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { if (Math.abs(e.deltaX) > 30) { go(page + Math.sign(e.deltaX)); } }
    else if (onVertical && Math.abs(e.deltaY) > 25) onVertical(-e.deltaY);
  }, { passive: true });
  return {
    strip, go,
    set(pages) { strip.innerHTML = ''; pages.forEach(p => strip.append(p)); count = pages.length; go(Math.min(page, count - 1), false); },
    get page() { return page; },
  };
}

function evalExpr(s) {

  const fac = () => { if (s[i] === '-') { i++; return -fac(); } if (s[i] === '+') { i++; return fac(); } let v = prim(); while (s[i] === '%') { i++; v /= 100; } return v; };

  const expr = () => { let v = term(); while (s[i] === '+' || s[i] === '-') { const o = s[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; };
  try { const v = expr(); return i === s.length ? v : null; } catch { return null; }
}

    return null;
  }
  async function send(text) {
    text = (text || input.value).trim(); if (!text) return;
    input.value = '';
    bubble('me', text);
    const l = local(text);
    if (l) { bubble('ai', l); history.push({ role: 'user', content: text }, { role: 'assistant', content: l }); return; }
    const b = bubble('ai', ''); b.append(h('div', { class: 'ai-shimmer' }));
    try {
      if (!AI.ready) throw new AIError('nokey');
      history.push({ role: 'user', content: text });
      const ctx = `[휴대전화 정보: ${fmtDate(new Date())} ${fmtST(new Date())}, ${S.wxCity} ${Weather.now.t}° ${wxInfo(Weather.now.code)[1]}]`;
      const msgs = history.slice(-12).map((m, i, a) => i === a.length - 1 ? { role: 'user', content: `${ctx}\n${m.content}` } : m);
      const ans = await AI.ask('You are Galaxy AI, the built-in assistant of a Galaxy phone running Galaxy OS. Reply in the user\'s language (Korean by default), short and friendly, plain text without Markdown. The phone itself already handles alarms, timers, opening apps and toggling settings, so for those just tell the user how to phrase the command (e.g. "7시 알람 맞춰줘").', msgs, { max: 2000 });
      history.push({ role: 'assistant', content: ans });
      b.textContent = ans;
    } catch (e) { history.pop(); b.textContent = aiErrText(e); if (e.code === 'nokey') b.append(h('button', { class: 'tbtn', style: 'display:block;margin-top:6px;padding:4px 0', onclick: () => { close(); WM.open('settings', { page: 'ai' }); } }, 'Galaxy AI 설정 열기')); }
    log.scrollTop = log.scrollHeight;
  }
  input.addEventListener('osenter', () => send());
  function listen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast('이 브라우저에서는 음성 인식을 사용할 수 없습니다');
    const r = new SR(); r.lang = 'ko-KR';
    r.onresult = e => send(e.results[0][0].transcript);
    r.onerror = () => toast('음성을 인식하지 못했습니다');
    try { r.start(); toast('말씀하세요…'); } catch {}
  }
  function open(prompt) {
    if (Lock.locked) Lock.unlock();
    Shade.close(); Ctx.hide();
    if (!el) {
      el = h('div', { class: 'asst', onclick: e => { if (e.target === el) close(); } },
        h('div', { class: 'as-panel glass ai-ring' },
          h('div', { class: 'ais-head' }, h('span', { class: 'ai-badge', html: svg('ai') }), h('div', { class: 'tx' }, h('b', null, 'Galaxy AI'), h('small', null, AI.ready ? '무엇을 도와드릴까요?' : '기기 명령 사용 가능 · 대화는 API 키 연결 필요')), iconBtn('x', close, '닫기')),
          log,
          h('div', { class: 'as-chips' }, ['오늘 브리핑', '7시 30분 알람 맞춰줘', '5분 타이머', '다크 모드 켜줘'].map(c => h('button', { class: 'glass', onclick: () => send(c) }, c))),
          h('div', { class: 'composer' }, input, iconBtn('mic', listen, '음성으로 말하기'), h('button', { class: 'send ai-grad', 'aria-label': '보내기', html: svg('send'), onpointerdown: e => e.preventDefault(), onclick: () => send() }))));
      if (!log.children.length) bubble('ai', '안녕하세요! Galaxy AI예요. 알람·타이머·설정 변경 같은 명령이나 궁금한 것을 말씀해 주세요.');
    }
    $('#content').append(el);
    vibrate(20);
    if (prompt) send(prompt);
  }
  function close() { if (el && el.isConnected) { KB.close(); el.remove(); } }
  return { open, close, brief, get open_() { return !!(el && el.isConnected); } };
})();

/* ---------- Circle to Search (long-press the Home button) ---------- */
const CircleSearch = (() => {
  let ov = null;
  function start() {
    if (Lock.locked || ov) return;
    KB.close(); Shade.close(); Ctx.hide();
    const c = document.createElement('canvas');
    const W = phone.clientWidth, H = phone.clientHeight;
    c.width = W * 2; c.height = H * 2; c.className = 'cts-canvas';
    const g = c.getContext('2d'); g.scale(2, 2);
    ov = h('div', { class: 'cts' }, c, h('div', { class: 'cts-hint glass' }, h('span', { html: svg('ai') }), '검색할 대상에 동그라미를 그리거나 탭하세요'), h('button', { class: 'cts-x glass', 'aria-label': '닫기', html: svg('x'), onclick: stop }));
    phone.append(ov);
    vibrate([10, 40, 10]);
    let pts = [];
    const grad = () => { const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#8a6bff'); gr.addColorStop(0.5, '#3c8dff'); gr.addColorStop(1, '#ff6ad5'); return gr; };
    const draw = () => {
      g.clearRect(0, 0, W, H); if (pts.length < 2) return;
      g.lineCap = g.lineJoin = 'round'; g.shadowColor = 'rgba(120,120,255,.8)'; g.shadowBlur = 14;
      g.strokeStyle = grad(); g.lineWidth = 7; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.stroke();
      g.shadowBlur = 0; g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2.5; g.stroke();
    };
    c.addEventListener('pointerdown', e => {
      pts = [localPt(e)]; c.setPointerCapture(e.pointerId);
      const mv = ev => { pts.push(localPt(ev)); draw(); };
      const up = () => { c.removeEventListener('pointermove', mv); c.removeEventListener('pointerup', up); finish(pts); };
      c.addEventListener('pointermove', mv); c.addEventListener('pointerup', up);
    });
  }
  function finish(pts) {
    let x1 = Math.min(...pts.map(p => p.x)), x2 = Math.max(...pts.map(p => p.x)), y1 = Math.min(...pts.map(p => p.y)), y2 = Math.max(...pts.map(p => p.y));
    if (x2 - x1 < 24 && y2 - y1 < 24) { x1 -= 70; x2 += 70; y1 -= 26; y2 += 26; } // a tap selects the area around it
    const box = { x1, y1, x2, y2 };
    const { text, image } = collect(box);
    // show the selection as a glowing rounded box
    ov.querySelector('canvas').style.opacity = 0;
    ov.querySelector('.cts-hint').remove();
    ov.classList.add('done'); // the result sheet and the navigation bar sit above the selection
    ov.append(h('div', { class: 'cts-sel', style: `left:${x1}px;top:${y1}px;width:${x2 - x1}px;height:${y2 - y1}px` }));
    const q = text || (image ? '선택한 이미지' : '');
    if (!q) { toast('선택한 영역에서 내용을 찾지 못했습니다'); stop(); return; }
    AISheet.show({
      title: '서클 투 서치', sub: text ? `"${text.length > 40 ? text.slice(0, 40) + '…' : text}"` : '이미지 선택됨', local: !AI.ready,
      run: () => AI.ready
        ? AI.ask('사용자가 휴대전화 화면에서 동그라미를 그려 선택한 내용입니다. 그것이 무엇인지 한국어로 3~4문장의 "AI 개요"로 설명하세요. 마크다운 없이 일반 텍스트로 답하세요.', text || '(텍스트 없는 이미지 영역)', { max: 1500 })
        : `선택한 내용\n${q}\n\nAI 개요를 보려면 설정 › Galaxy AI에서 Claude API 키를 연결하세요.`,
      actions: [
        { label: '웹 검색', primary: true, fn: () => WM.open('internet', { q }) },
        { label: '번역', fn: () => AISheet.show({ title: '번역', run: () => AI.translate(q, /[가-힣]/.test(q) ? 'en' : 'ko'), local: !AI.ready, actions: [{ label: '복사', fn: t => Clip.add(t) }] }) },
        { label: '복사', fn: () => Clip.add(q) },
      ],
    });
    const watch = setInterval(() => { if (!AISheet.open) { clearInterval(watch); stop(); } }, 200);
  }
  // text nodes that are actually visible inside the circled box
  function collect(b) {
    const r0 = phone.getBoundingClientRect(), toC = (x, y) => ({ x: r0.left + x * SCALE, y: r0.top + y * SCALE });
    const a = toC(b.x1, b.y1), z = toC(b.x2, b.y2);
    ov.style.pointerEvents = 'none';
    const out = [], seen = new Set(); let image = false;
    const tw = document.createTreeWalker(phone, NodeFilter.SHOW_TEXT);
    const rg = document.createRange();
    for (let n = tw.nextNode(); n; n = tw.nextNode()) {
      const t = n.textContent.trim(); if (!t || ov.contains(n)) continue;
      rg.selectNodeContents(n);
      for (const r of rg.getClientRects()) {
        if (r.right < a.x || r.left > z.x || r.bottom < a.y || r.top > z.y || !r.width) continue;
        const top = document.elementFromPoint(clamp((r.left + r.right) / 2, a.x, z.x), clamp((r.top + r.bottom) / 2, a.y, z.y));
        if (top && (top === n.parentElement || n.parentElement.contains(top) || top.contains(n.parentElement)) && !seen.has(n)) { seen.add(n); out.push(t); }
        break;
      }
    }
    for (let y = a.y + 6; y < z.y; y += 24) for (let x = a.x + 6; x < z.x; x += 24) { const e = document.elementFromPoint(x, y); if (e && (e.tagName === 'IMG' || e.tagName === 'VIDEO' || /url\(/.test(getComputedStyle(e).backgroundImage))) image = true; }
    ov.style.pointerEvents = '';
    return { text: out.join(' ').replace(/\s+/g, ' ').slice(0, 600), image };
  }
  function stop() { if (ov) { ov.remove(); ov = null; } }
  return { start, stop, get active() { return !!ov; } };
})();

/* ---------- Photo Assist: on-device style transfer with an AI watermark ---------- */
const PhotoAssist = (() => {
  const STYLES = [['watercolor', '수채화'], ['cartoon', '만화'], ['sketch', '스케치'], ['vintage', '빈티지'], ['neon', '네온'], ['pop', '팝아트']];
  function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
  async function apply(src, style) {
    const img = await loadImg(src);
    const W = 540, Hh = Math.round(W * (img.naturalHeight || 960) / (img.naturalWidth || 540));
    const c = document.createElement('canvas'); c.width = W; c.height = Hh; const g = c.getContext('2d');
    const filters = { watercolor: 'saturate(1.35) contrast(1.05) blur(1.4px)', cartoon: 'saturate(1.5) contrast(1.15)', sketch: 'grayscale(1)', vintage: 'sepia(.65) contrast(1.08) saturate(.85) brightness(1.03)', neon: 'saturate(2.2) hue-rotate(35deg) contrast(1.35)', pop: 'saturate(2.6) contrast(1.4)' };
    g.filter = filters[style]; g.drawImage(img, 0, 0, W, Hh); g.filter = 'none';
    const d = g.getImageData(0, 0, W, Hh), p = d.data;
    if (style === 'cartoon' || style === 'pop') {
      const lv = style === 'pop' ? 3 : 5, step = 255 / (lv - 1);
      const gray = new Float32Array(W * Hh); for (let i = 0; i < W * Hh; i++) gray[i] = p[i * 4] * .3 + p[i * 4 + 1] * .59 + p[i * 4 + 2] * .11;
      for (let y = 1; y < Hh - 1; y++) for (let x = 1; x < W - 1; x++) {
        const i = y * W + x, gx = gray[i + 1] - gray[i - 1], gy = gray[i + W] - gray[i - W], edge = Math.hypot(gx, gy) > (style === 'pop' ? 60 : 42);
        for (let k = 0; k < 3; k++) p[i * 4 + k] = edge ? 25 : Math.round(p[i * 4 + k] / step) * step;
      }
    } else if (style === 'sketch') {
      // colour-dodge pencil effect
      const src2 = new Uint8ClampedArray(p), blur = new Float32Array(W * Hh), R = 4;
      for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) { let s = 0, n = 0; for (let dy = -R; dy <= R; dy += 2) for (let dx = -R; dx <= R; dx += 2) { const xx = clamp(x + dx, 0, W - 1), yy = clamp(y + dy, 0, Hh - 1); s += 255 - src2[(yy * W + xx) * 4]; n++; } blur[y * W + x] = s / n; }
      for (let i = 0; i < W * Hh; i++) { const v = Math.min(255, src2[i * 4] * 255 / Math.max(1, 255 - blur[i])); p[i * 4] = p[i * 4 + 1] = p[i * 4 + 2] = v; }
    } else if (style === 'watercolor') {
      for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - .5) * 14; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
    }
    g.putImageData(d, 0, 0);
    if (style === 'vintage') { const vg = g.createRadialGradient(W / 2, Hh / 2, W * .3, W / 2, Hh / 2, W * .85); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(40,20,0,.55)'); g.fillStyle = vg; g.fillRect(0, 0, W, Hh); }
    if (style === 'neon') { g.globalCompositeOperation = 'screen'; g.filter = 'blur(8px)'; g.drawImage(c, 0, 0); g.filter = 'none'; g.globalCompositeOperation = 'source-over'; }
    // Galaxy AI marks generated images with a visible watermark
    g.font = '600 15px sans-serif'; g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(12, Hh - 36, 98, 24); g.fillStyle = '#fff'; g.fillText('✦ AI 생성', 22, Hh - 18);
    return c.toDataURL('image/jpeg', 0.85);
  }
  function open(photo, onSaved) {
    let chosen = null;
    AISheet.show({
      title: '포토 어시스트', sub: '스타일을 고르면 새 사진으로 저장됩니다', local: true,
      run: () => '',
      render: (_, box) => {
        const prev = h('div', { class: 'pa-prev', style: `background-image:url("${photo.src}")` });
        const row = h('div', { class: 'as-chips', style: 'padding:10px 0 0' });
        STYLES.forEach(([k, l]) => row.append(h('button', { class: 'glass', onclick: async e => {
          row.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.currentTarget));
          prev.classList.add('busy');
          try { chosen = await apply(photo.src, k); prev.style.backgroundImage = `url("${chosen}")`; } catch { toast('이 이미지는 편집할 수 없습니다'); }
          prev.classList.remove('busy');
        } }, l)));
        box.append(prev, row);
      },
      actions: [{ label: '새 사진으로 저장', primary: true, fn: () => {
        if (!chosen) return toast('먼저 스타일을 선택하세요');
        let list = [{ id: uid(), src: chosen, t: Date.now(), ai: true }, ...store.get('photos', [])].slice(0, 12);
        while (list.length) { try { localStorage.setItem('gos.photos', JSON.stringify(list)); break; } catch { list = list.slice(0, -1); } }
        emit('photos'); toast('AI 편집 사진을 저장했습니다'); onSaved && onSaved();
      } }],
    });
  }
  return { open, apply };
})();

/* ---------------- 통역 (Interpreter) ---------------- */
defineApp('interpreter', '통역', '#6b4dff', 'translate', el => {
  // bottom half: me; top half (rotated) for the person across the table
  const st = { me: 'ko', you: 'en' };
  const half = who => {
    const lang = h('button', { class: 'ip-lang glass' });
    const text = h('div', { class: 'ip-text' });
    const mic = h('button', { class: 'ip-mic ai-grad', 'aria-label': '말하기', html: svg('mic') });
    const box = h('div', { class: 'ip-half ' + who }, lang, text, mic);
    return { box, lang, text, mic };
  };
  const top = half('you'), bot = half('me');
  const input = h('input', { type: 'text', class: 'field', placeholder: '입력해서 통역하기', inputmode: 'none', 'data-enter': '통역' });
  el.append(h('div', { class: 'view ip' }, top.box, h('div', { class: 'ip-mid' }, h('button', { class: 'ibtn', 'aria-label': '언어 바꾸기', html: svg('rotate'), onclick: () => { [st.me, st.you] = [st.you, st.me]; paint(); } })), bot.box, h('div', { class: 'composer' }, input)));
  const pickLang = side => {
    Ctx.vertical = true;
    const r = (side === 'me' ? bot : top).lang.getBoundingClientRect();
    Ctx.show(localPt({ clientX: r.left + r.width / 2, clientY: side === 'me' ? r.top : r.bottom + 260 }), Object.entries(LANGS).map(([k, [n]]) => ({ label: n, fn: () => { st[side] = k; paint(); } })));
  };
  top.lang.onclick = () => pickLang('you'); bot.lang.onclick = () => pickLang('me');
  function paint() {
    top.lang.textContent = LANGS[st.you][0]; bot.lang.textContent = LANGS[st.me][0];
    if (!bot.text.textContent) bot.text.innerHTML = '<span class="ip-ph">마이크를 누르고 말하세요</span>';
    if (!top.text.textContent) top.text.innerHTML = `<span class="ip-ph">${st.you === 'en' ? 'Tap the mic and speak' : '마이크를 누르고 말하세요'}</span>`;
  }
  function speak(text, lang) {
    try { if (!window.speechSynthesis || S.silent) return; const u = new SpeechSynthesisUtterance(text); u.lang = LANGS[lang][1]; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
  }
  async function interpret(text, from) {
    const to = from === 'me' ? 'you' : 'me';
    const src = from === 'me' ? bot : top, dst = from === 'me' ? top : bot;
    src.text.textContent = text;
    dst.text.innerHTML = '<div class="ai-shimmer"></div><div class="ai-shimmer" style="width:60%"></div>';
    try { const out = await AI.translate(text, st[to], st[from]); dst.text.textContent = out; speak(out, st[to]); }
    catch (e) { dst.text.textContent = aiErrText(e); }
  }
  function listen(from) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast('이 브라우저에서는 음성 인식을 사용할 수 없습니다. 아래 입력창을 사용하세요.');
    const r = new SR(); r.lang = LANGS[st[from]][1];
    const b = (from === 'me' ? bot : top).mic; b.classList.add('rec');
    r.onresult = e => interpret(e.results[0][0].transcript, from);
    r.onerror = () => toast('음성을 인식하지 못했습니다');
    r.onend = () => b.classList.remove('rec');
    try { r.start(); } catch { b.classList.remove('rec'); }
  }
  top.mic.onclick = () => listen('you'); bot.mic.onclick = () => listen('me');
  input.addEventListener('osenter', () => { const t = input.value.trim(); if (t) { input.value = ''; KB.close(); interpret(t, 'me'); } });
  paint();
  return {};
});
