<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Galaxy OS 1.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 30% 20%,#2a2f45,#0b0c10 70%);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
svg{display:block}

/* ---------- device frame ---------- */
.device{position:relative;width:392px;height:850px;border-radius:56px;background:#0d0d0f;padding:11px;box-shadow:0 0 0 2px #34343a,0 0 0 5px #141416,0 40px 90px rgba(0,0,0,.6);transform-origin:center;flex:none}
.device .hw{position:absolute;right:-7px;width:5px;background:#2c2c32;border-radius:0 3px 3px 0}
.device .hw.vol{top:170px;height:96px}
.device .hw.power{top:290px;height:66px;cursor:pointer}
.device .hw.power:active{background:#45454c}
.phone{--bg:#f4f4f6;--surface:#fff;--surface2:#ececf0;--text:#111114;--sub:#6e6e75;--line:rgba(0,0,0,.08);--accent:#3c74f0;--danger:#e5484d;--ok:#22b45a;--kb-bg:#e6e7eb;--key:#fff;--key-fn:#d2d4da;--key-text:#16161a;--shade:rgba(244,244,246,.94);--chip:#fff;
  position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;background:#000;color:var(--text);isolation:isolate}
.phone[data-theme=dark]{--bg:#000;--surface:#171719;--surface2:#232327;--text:#f2f2f4;--sub:#9b9ba3;--line:rgba(255,255,255,.1);--accent:#5f8fff;--kb-bg:#141416;--key:#38383d;--key-fn:#26262a;--key-text:#f2f2f2;--shade:rgba(18,18,20,.94);--chip:#26262a}
@media (max-width:520px),(max-height:640px){
  body{display:block}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none!important}
  .device .hw,.punch{display:none}
  .phone{border-radius:0}
}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .4s}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:95;opacity:0}

/* ---------- stage ---------- */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:34px}
.content{position:relative;flex:1;min-height:0}
.layer{position:absolute;inset:0}

.statusbar{position:absolute;top:0;left:0;right:0;height:34px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;touch-action:none;transition:color .2s}
.phone.in-app .statusbar{background:var(--bg);color:var(--text)}
.phone.light-ui .statusbar{color:#111}
.statusbar .l,.statusbar .r{display:flex;align-items:center;gap:5px}
.statusbar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.statusbar .nicons svg{width:13px;height:13px;opacity:.85}
.batt{display:flex;align-items:center;gap:3px;font-size:12px}
.batt i{position:relative;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;display:block}
.batt i::after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.batt b{position:absolute;left:1px;top:1px;bottom:1px;background:currentColor;border-radius:1px}
.punch{position:absolute;top:10px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#050506;z-index:200;box-shadow:inset 0 0 0 2px #121216;pointer-events:none}

.navbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-around;padding:0 30px;color:#fff;position:relative;z-index:30;transition:background .2s,color .2s}
.phone.in-app .navbar{background:var(--bg);color:var(--text)}
.phone.kb-open .navbar{background:var(--kb-bg);color:var(--text)}
.navbar button{width:64px;height:40px;display:grid;place-items:center;border-radius:20px}
.navbar button:active{background:rgba(128,128,128,.25)}
.navbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- icons ---------- */
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;min-width:0}
.ic span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none;transition:transform .12s}
.ic:active .sq{transform:scale(.9)}
.sq svg{width:29px;height:29px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sq.sm{width:36px;height:36px;border-radius:12px}.sq.sm svg{width:19px;height:19px}
.sq.xs{width:22px;height:22px;border-radius:7px;box-shadow:none}.sq.xs svg{width:13px;height:13px;stroke-width:2.2}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;padding:0 14px 4px;touch-action:none}
.widget{color:#fff;padding:30px 10px 6px;text-shadow:0 1px 10px rgba(0,0,0,.3)}
.widget .t{font-size:66px;font-weight:250;letter-spacing:-2px;line-height:1}
.widget .d{font-size:15px;margin-top:8px;opacity:.92}
.widget .w{font-size:13px;margin-top:4px;opacity:.75}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 4px;align-content:start;flex:1;padding-top:26px}
.drawer-hint{align-self:center;color:#fff;opacity:.8;padding:4px 20px}
.drawer-hint svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.dock{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 4px}
.dock .ic span{display:none}

/* ---------- drawer ---------- */
#drawer{background:rgba(10,10,16,.45);backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);transform:translateY(100%);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;display:flex;flex-direction:column;z-index:5;visibility:hidden}
#drawer.open{transform:none;opacity:1;visibility:visible}
.dr-head{padding:14px 18px 10px;touch-action:none}
.dr-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:24px;padding:0 14px;color:#fff}
.dr-search svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.dr-search input{flex:1;border:0;outline:0;background:none;color:#fff;font-size:15px;padding:11px 0}
.dr-search input::placeholder{color:rgba(255,255,255,.7)}
.dr-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 4px;align-content:start;padding:12px 14px 20px;touch-action:pan-y;overscroll-behavior:contain}
.dr-empty{grid-column:1/-1;text-align:center;color:rgba(255,255,255,.75);padding:40px 0;font-size:14px}

/* ---------- apps ---------- */
#apps{z-index:10;pointer-events:none}
.app{position:absolute;inset:0;background:var(--bg);color:var(--text);display:none;pointer-events:auto;overflow:hidden}
.app.active{display:block}
.app.opening{animation:appIn .28s cubic-bezier(.2,.8,.2,1)}
.app.closing{animation:appOut .22s ease-in forwards}
@keyframes appIn{from{transform:scale(.88);opacity:0;border-radius:30px}to{transform:none;opacity:1}}
@keyframes appOut{to{transform:scale(.86);opacity:0;border-radius:30px}}
.view{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.view.pushin{animation:pushIn .26s cubic-bezier(.2,.8,.2,1)}
.view.popout{animation:popOut .2s ease-in forwards}
@keyframes pushIn{from{transform:translateX(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes popOut{to{transform:translateX(40%);opacity:0}}
.pg-head{padding:34px 22px 14px;display:flex;align-items:flex-end;gap:4px;min-height:118px;flex:none}
.pg-head .grow{flex:1;min-width:0}
.pg-head h1{font-size:30px;font-weight:600;letter-spacing:-.5px}
.pg-head .sub{font-size:13px;color:var(--sub);margin-top:4px}
.bar{height:56px;display:flex;align-items:center;padding:0 6px;gap:2px;flex:none}
.bar .title{flex:1;font-size:19px;font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-body{flex:1;overflow-y:auto;padding:0 14px 24px;overscroll-behavior:contain;position:relative}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text)}
.ibtn:active{background:var(--surface2)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:24px;overflow:hidden;margin-bottom:12px}
.card-t{font-size:13px;color:var(--sub);padding:14px 22px 2px;font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;min-height:58px;cursor:pointer;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:20px;right:20px;height:1px;background:var(--line)}
.row:active{background:var(--surface2)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--sub);flex:none}
.switch{width:46px;height:27px;border-radius:14px;background:#b9b9c0;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(19px)}
.fab{position:absolute;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.field{width:100%;border:0;outline:0;background:var(--surface);border-radius:16px;padding:13px 16px;font-size:16px;color:var(--text)}
.field:focus{box-shadow:0 0 0 2px var(--accent) inset}
textarea.field{resize:none;line-height:1.5}
.pill{background:var(--accent);color:#fff;border-radius:24px;padding:11px 22px;font-weight:600;font-size:15px}
.pill.ghost{background:var(--surface2);color:var(--text)}
.pill.red{background:var(--danger)}
.tabbar{display:flex;flex:none;background:var(--bg);border-top:1px solid var(--line)}
.tabbar button{flex:1;padding:14px 0 12px;font-size:14px;color:var(--sub);font-weight:500}
.tabbar button.on{color:var(--text);font-weight:700}
.empty{color:var(--sub);text-align:center;padding:50px 10px;font-size:14px;line-height:1.6}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:17px;flex:none}
.av.lg{width:96px;height:96px;font-size:40px}
.seg{display:flex;background:var(--surface2);border-radius:20px;padding:3px;gap:2px}
.seg button{flex:1;border-radius:17px;padding:8px 0;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- keyboard ---------- */
#kb{display:none;background:var(--kb-bg);color:var(--key-text);padding:0 4px 2px;touch-action:none;flex:none;position:relative;z-index:30}
#kb.show{display:block}
.kb-tool{height:42px;display:flex;align-items:center;gap:2px;padding:0 4px}
.kb-tool button{width:42px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--key-text)}
.kb-tool button.on{background:var(--key-fn)}
.kb-tool svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kb-tool .lbl{flex:1;text-align:center;font-size:12px;color:var(--sub);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.kb-rows{display:flex;flex-direction:column;gap:8px;padding:2px 0 6px}
.kb-row{display:flex;gap:5px}
.kb-sp{flex:.5}
.key{flex:1;height:43px;border-radius:7px;background:var(--key);color:var(--key-text);font-size:20px;display:grid;place-items:center;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.18);cursor:pointer;min-width:0}
.key.fn{background:var(--key-fn);font-size:14px;font-weight:500}
.key.wide{flex:1.45}.key.space{flex:4;font-size:12px;color:var(--sub)}
.key svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.key.down{filter:brightness(.82)}
.phone[data-theme=dark] .key.down{filter:brightness(1.35)}
.key.ch.down::after{content:attr(data-c);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:46px;height:54px;padding:0 6px;border-radius:12px;background:var(--key);color:var(--key-text);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 16px rgba(0,0,0,.28);pointer-events:none;z-index:5}
.key.shift.on{color:var(--accent)}
.key.shift.lock svg{fill:var(--accent);stroke:var(--accent)}
.key.enter{background:var(--accent);color:#fff}
.key small{font-size:10px;opacity:.7;position:absolute;bottom:3px;right:6px}
.kb-panel{overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);padding:2px}
.emoji-grid button{font-size:25px;height:44px;border-radius:8px}
.emoji-grid button:active{background:var(--key-fn)}
.clip-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 8px;font-size:13px;color:var(--sub)}
.clip-head button{color:var(--accent);font-size:13px;font-weight:600}
.clip-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 2px 6px}
.clip-item{background:var(--key);border-radius:12px;padding:10px 26px 10px 11px;font-size:13px;height:78px;overflow:hidden;text-align:left;position:relative;line-height:1.35;word-break:break-all;color:var(--key-text)}
.clip-item .acts{position:absolute;top:4px;right:3px;display:flex;flex-direction:column;gap:2px}
.clip-item .acts span{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--sub)}
.clip-item .acts span.on{color:var(--accent)}
.clip-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kb-bottom{display:flex;gap:5px;padding:4px 0 6px}

/* ---------- overlays ---------- */
#shade{position:absolute;inset:0;z-index:60;background:var(--shade);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transform:translateY(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;color:var(--text)}
#shade.open{transform:none}
.sh-top{padding:40px 22px 8px;display:flex;align-items:flex-end;justify-content:space-between;touch-action:none}
.sh-top .t{font-size:34px;font-weight:300}
.sh-top .d{font-size:13px;color:var(--sub)}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:14px 18px}
.qs button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--text)}
.qs .q{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--text);transition:background .2s}
.qs .on .q{background:var(--accent);color:#fff}
.qs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bright{display:flex;align-items:center;gap:12px;margin:4px 18px 10px;background:var(--surface);border-radius:28px;padding:10px 18px}
.bright svg{width:20px;height:20px;stroke:var(--sub);fill:none;stroke-width:2;flex:none}
.sh-list{flex:1;overflow-y:auto;padding:4px 14px 10px;touch-action:pan-y}
.noti{background:var(--surface);border-radius:20px;padding:13px 16px;margin-bottom:8px;display:flex;gap:12px;cursor:pointer}
.noti .tx{flex:1;min-width:0}.noti b{font-size:14px;display:block}.noti p{font-size:13.5px;color:var(--sub);margin-top:2px;word-break:break-all}
.noti .tm{font-size:11px;color:var(--sub);flex:none}
.sh-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 16px;touch-action:none}
.sh-foot .handle{width:40px;height:5px;border-radius:3px;background:var(--sub);opacity:.5;margin:0 auto}
#headsup{position:absolute;top:40px;left:10px;right:10px;z-index:70;transform:translateY(-140%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#headsup.show{transform:none}
#headsup .noti{box-shadow:0 8px 28px rgba(0,0,0,.25);margin:0}
#toast{position:absolute;left:50%;bottom:70px;transform:translate(-50%,20px);background:rgba(40,40,44,.94);color:#fff;font-size:14px;padding:11px 20px;border-radius:22px;z-index:90;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ctx{position:absolute;z-index:85;display:none;background:var(--surface);color:var(--text);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.28);padding:3px;white-space:nowrap}
#ctx.show{display:flex}
#ctx button{padding:10px 12px;font-size:14px;border-radius:11px}
#ctx button:active{background:var(--surface2)}
#dialog{position:absolute;inset:0;z-index:88;background:rgba(0,0,0,.4);display:none;align-items:flex-end;padding:0 12px 70px}
#dialog.show{display:flex}
.dlg{background:var(--surface);color:var(--text);border-radius:28px;padding:24px 22px 14px;width:100%;animation:pushUp .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pushUp{from{transform:translateY(30px);opacity:0}}
.dlg h3{font-size:19px;font-weight:600;text-align:center}
.dlg p{font-size:14.5px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.5}
.dlg .btns{display:flex;margin-top:18px}
.dlg .btns button{flex:1;padding:12px;font-size:16px;font-weight:600;border-radius:14px}
.dlg .btns button:active{background:var(--surface2)}
.dlg .btns .ok{color:var(--accent)}.dlg .btns .warn{color:var(--danger)}

/* recents */
#recents{z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;flex-direction:column}
#recents.open{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.rc-list{flex:1;display:flex;gap:16px;overflow-x:auto;padding:26px 15%;align-items:center;scroll-snap-type:x mandatory;touch-action:pan-x}
.rc-card{flex:none;width:70%;height:86%;display:flex;flex-direction:column;gap:10px;scroll-snap-align:center;transition:transform .2s,opacity .2s}
.rc-card .hd{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:600}
.rc-card .hd .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.rc-card .hd .x svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.rc-prev{flex:1;border-radius:22px;overflow:hidden;position:relative;background:var(--bg);cursor:pointer}
.rc-prev>.app{display:block!important;pointer-events:none;transform-origin:0 0;inset:auto;left:0;top:0}
.rc-foot{text-align:center;padding:6px 0 18px}
.rc-foot button{color:#fff;background:rgba(255,255,255,.18);border-radius:22px;padding:10px 26px;font-size:14px;font-weight:600}
.rc-empty{color:rgba(255,255,255,.8);margin:auto;font-size:15px}

/* lock & boot & off */
#lock{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;color:#fff;touch-action:none;transition:transform .3s,opacity .3s;cursor:grab}
#lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock.gone{display:none}
#lock .lbg{position:absolute;inset:0;background:inherit;z-index:-1}
.lk-clock{margin-top:96px;font-size:84px;font-weight:200;letter-spacing:-3px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.lk-date{font-size:17px;margin-top:10px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.lk-notis{width:100%;padding:28px 16px 0;display:flex;flex-direction:column;gap:8px}
.lk-notis .noti{background:rgba(255,255,255,.88);color:#111}
.lk-notis .noti p,.lk-notis .noti .tm{color:#555}

  const fac = () => { if (s[i] === '-') { i++; return -fac(); } if (s[i] === '+') { i++; return fac(); } let v = prim(); while (s[i] === '%') { i++; v /= 100; } return v; };

  const expr = () => { let v = term(); while (s[i] === '+' || s[i] === '-') { const o = s[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; };
  try { const v = expr(); return i === s.length ? v : null; } catch { return null; }

      msg.textContent = '카메라를 사용할 수 없습니다.\n브라우저의 카메라 권한을 허용하면 실제 카메라가 동작합니다.\n(셔터를 누르면 테스트 이미지가 저장됩니다)';
      msg.style.whiteSpace = 'pre-line';
    }
  }
  function stop() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  function shoot() {
    const c = document.createElement('canvas'); const W = 480;
    let src;
    if (stream && video.videoWidth) {
      c.width = W; c.height = Math.round(W * video.videoHeight / video.videoWidth);
      const g = c.getContext('2d');
      if (facing === 'user') { g.translate(W, 0); g.scale(-1, 1); }
      g.drawImage(video, 0, 0, c.width, c.height);
      src = c.toDataURL('image/jpeg', 0.72);
    } else {
      c.width = W; c.height = 640; const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, W, 640); gr.addColorStop(0, `hsl(${Math.random() * 360},70%,60%)`); gr.addColorStop(1, `hsl(${Math.random() * 360},70%,35%)`);
      g.fillStyle = gr; g.fillRect(0, 0, W, 640); g.fillStyle = 'rgba(255,255,255,.9)'; g.font = '600 34px sans-serif'; g.textAlign = 'center';
      g.fillText('Galaxy OS 1.0', W / 2, 300); g.font = '22px sans-serif'; g.fillText(new Date().toLocaleString('ko-KR'), W / 2, 344);
      src = c.toDataURL('image/jpeg', 0.8);
    }
    flash.style.opacity = 0.9; setTimeout(() => flash.style.opacity = 0, 120);
    if (!S.silent) tone(2200, 0.05, 0.05, 'square');
    const photos = store.get('photos', []); photos.unshift({ id: uid(), src, t: Date.now() });
    let list = photos.slice(0, 12);
    // drop the oldest photos until it fits in localStorage
    while (list.length) { try { localStorage.setItem('gos.photos', JSON.stringify(list)); break; } catch { list = list.slice(0, -1); } }
    emit('photos'); setThumb(); toast('사진이 저장되었습니다');
  }
  setThumb();
  return { show: start, hide: stop, destroy: stop };
});

        linkRow('home', '#9b51e0', '홈 화면 초기화', '앱 배치를 기본값으로 되돌립니다', async () => { if (await Dialog.confirm('홈 화면 초기화', '홈 화면 배치를 기본값으로 되돌릴까요?', '초기화')) { Home.reset(); toast('홈 화면을 초기화했습니다'); } })),

defineApp('clipboard', '클립보드', '#0ea5a4', 'clip', el => {
  const pg = Page('클립보드', { actions: [iconBtn('trash', async () => { if (await Dialog.confirm('클립보드 비우기', '고정되지 않은 항목을 모두 삭제할까요?', '삭제', true)) Clip.clear(); }, '모두 삭제')] });
  el.append(pg.el);
  const input = h('textarea', { class: 'field', rows: 2, placeholder: '여기에 입력한 뒤 [저장]을 누르면 클립보드에 복사됩니다', inputmode: 'none', style: 'margin-bottom:8px' });
  const list = h('div');
  pg.body.append(input, h('div', { style: 'display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px' },
    h('button', { class: 'pill ghost', style: 'padding:8px 16px;font-size:14px', onpointerdown: e => e.preventDefault(), onclick: async () => {
      try { const t = await navigator.clipboard.readText(); if (t) { Clip.add(t, { system: false, quiet: true }); toast('기기 클립보드에서 가져왔습니다'); } else toast('기기 클립보드가 비어 있습니다'); } catch { toast('브라우저가 클립보드 읽기를 허용하지 않습니다'); }
    } }, '기기에서 가져오기'),
    h('button', { class: 'pill', style: 'padding:8px 18px;font-size:14px', onpointerdown: e => e.preventDefault(), onclick: () => { if (input.value) { Clip.add(input.value); input.value = ''; } } }, '저장')), list);
  function render() {
    const items = Clip.sorted();
    pg.subEl.textContent = `항목 ${items.length}개 · 눌러서 복사`;
    list.innerHTML = '';
    if (!items.length) list.append(h('div', { class: 'empty' }, '클립보드가 비어 있습니다.\n앱에서 텍스트를 길게 눌러 복사해 보세요.'));
    items.forEach(it => list.append(h('div', { class: 'clipapp-item', onclick: () => { Clip.add(Clip.use(it.id)); } },
      h('div', { style: 'flex:1;min-width:0' }, h('p', null, it.text), h('small', null, (it.pin ? '📌 고정됨 · ' : '') + fmtAgo(it.t))),
      h('button', { class: 'ibtn' + (it.pin ? ' on' : ''), 'aria-label': '고정', html: svg('pin'), onclick: e => { e.stopPropagation(); Clip.pin(it.id); } }),
      h('button', { class: 'ibtn', 'aria-label': '삭제', html: svg('x'), onclick: e => { e.stopPropagation(); Clip.remove(it.id); } }))));
  }
  on('clip', render); render();
  return { show: render };
});

defineApp('internet', '인터넷', '#7a5af8', 'globe', el => {

  const url = h('input', { type: 'url', class: 'field', placeholder: '검색 또는 URL 입력', inputmode: 'none', 'data-kb': 'en', 'data-enter': '이동' });
  const frame = h('iframe', { class: 'web', title: '웹 페이지', sandbox: 'allow-scripts allow-same-origin allow-forms allow-popups' });
  const note = h('div', { style: 'font-size:11px;color:var(--sub);text-align:center;padding:4px 10px' }, '일부 사이트는 보안 정책 때문에 이곳에 표시되지 않을 수 있습니다.');
  const go = v => {
    v = (v || '').trim(); KB.close();
    if (!v) { frame.removeAttribute('src'); frame.srcdoc = START; url.value = ''; return; }
    let u = /^https?:\/\//i.test(v) ? v : /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v) ? 'https://' + v : 'https://ko.m.wikipedia.org/w/index.php?search=' + encodeURIComponent(v);
    frame.removeAttribute('srcdoc'); frame.src = u; url.value = u;
    const hist = store.get('webHist', []); hist.unshift(u); store.set('webHist', hist.slice(0, 20));
  };
  url.addEventListener('osenter', () => go(url.value));
  el.append(h('div', { class: 'view' }, h('div', { class: 'urlbar' }, iconBtn('home', () => go(''), '시작 페이지'), url, iconBtn('refresh', () => { if (frame.src) frame.src = frame.src; }, '새로고침')), frame, note));
  url.addEventListener('focus', () => setTimeout(() => url.select(), 0));
  go('');
  return {};
});
