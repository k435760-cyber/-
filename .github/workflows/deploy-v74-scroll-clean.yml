name: Deploy V74 clean scroll fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-v74-scroll-clean.yml"
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace accumulated scroll patches
        shell: python
        run: |
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old_assets = [
            '<link rel="stylesheet" href="./v67-scroll-fix.css">\n',
            '<link rel="stylesheet" href="./v68-scroll-height-fix.css">\n',
            '<link rel="stylesheet" href="./v69-scroll-fix.css">\n',
            '<link rel="stylesheet" href="./v71-scroll-guard.css">\n',
            '<link rel="stylesheet" href="./v73-footer-scroll-fix.css">\n',
            '<script src="./v69-scroll-fix.js" defer></script>\n',
            '<script src="./v71-scroll-guard.js" defer></script>\n',
          ]
          for x in old_assets:
              s=s.replace(x,"")

          old_body='<body class="min-h-screen text-slate-800 dark:text-slate-100 flex flex-col justify-between relative selection:bg-blue-500 selection:text-white bg-slate-50 dark:bg-slate-950 antialiased overflow-x-hidden">'
          new_body='<body class="min-h-[100dvh] text-slate-800 dark:text-slate-100 flex flex-col relative selection:bg-blue-500 selection:text-white bg-slate-50 dark:bg-slate-950 antialiased overflow-x-hidden">'
          if old_body in s:
              s=s.replace(old_body,new_body,1)
          elif new_body not in s:
              raise SystemExit("body class target missing")

          old_root='<div class="relative z-10 flex flex-col min-h-screen">'
          new_root='<div class="relative z-10 flex flex-col flex-1 min-h-0">'
          if old_root in s:
              s=s.replace(old_root,new_root,1)
          elif new_root not in s:
              raise SystemExit("root class target missing")

          if "./v74-scroll-clean.css" not in s:
              s=s.replace("</head>", '<link rel="stylesheet" href="./v74-scroll-clean.css">\n</head>',1)
          if "./v74-view-normalizer.js" not in s:
              s=s.replace("</body>", '<script src="./v74-view-normalizer.js" defer></script>\n</body>',1)

          if "v69-scroll-fix.js" in s or "v71-scroll-guard.js" in s:
              raise SystemExit("old scroll JS still linked")
          if "v67-scroll-fix.css" in s or "v68-scroll-height-fix.css" in s or "v69-scroll-fix.css" in s or "v71-scroll-guard.css" in s or "v73-footer-scroll-fix.css" in s:
              raise SystemExit("old scroll CSS still linked")
          if "'unsafe-eval'" in s[s.rfind("<meta",0,s.find("Content-Security-Policy")):s.find("/>",s.find("Content-Security-Policy"))]:
              raise SystemExit("unsafe-eval returned")
          if not s.rstrip().endswith("</html>"):
              raise SystemExit("broken HTML")

          p.write_text(s,encoding="utf-8")

      - name: Validate V74 JS
        run: node --check v74-view-normalizer.js

      - name: Commit V74
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy V74 clean scroll layout"
          git push origin main
