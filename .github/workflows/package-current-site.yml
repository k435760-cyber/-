name: Package current site ZIP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-current-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify V63 marker
        shell: python
        run: |
          from pathlib import Path
          t=Path("index.html").read_text(encoding="utf-8")
          if "V63-tablet-safe-pdf-renderer" not in t:
              raise SystemExit("V63 marker missing")
          print("V63 marker OK")
      - name: Upload Cloudflare-ready site
        uses: actions/upload-artifact@v4
        with:
          name: yougje-v63-pdf-preview
          path: index.html
          if-no-files-found: error
          retention-days: 7
