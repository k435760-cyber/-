name: Fix PDF insertion freeze V59
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pdf-freeze-v59.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make mobile PDF preview on-demand
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          text=p.read_text(encoding="utf-8")
          marker="V59-mobile-pdf-on-demand"
          if marker in text:
              print("already applied")
              raise SystemExit(0)

          start=text.find("async function renderStudyNotePdfAttachments()")
          if start<0:
              raise RuntimeError("renderStudyNotePdfAttachments not found")
          pos=text.find("items.forEach((a,index)=>{",start)
          if pos<0:
              raise RuntimeError("PDF preview scheduling loop not found")

          guard="""// V59-mobile-pdf-on-demand
           // 모바일에서는 삽입 직후 PDF.js 자동 렌더링을 하지 않는다.
           // 큰 PDF의 캔버스 렌더가 메인 스레드를 점유해 앱이 멈추는 문제를 차단한다.
           const mobile=window.matchMedia?.('(max-width: 767px)')?.matches||window.innerWidth<768;
           if(mobile){
            items.forEach(a=>{
             const holder=document.getElementById('study-note-pdf-pages-'+a.id);
             if(!holder)return;
             holder.dataset.pdfStage='manual';
             holder.innerHTML='<div class="study-note-pdf-status"><div>PDF 저장 완료 · 미리보기는 필요할 때 열어요.</div><div class="study-note-pdf-status-actions"><button type="button" class="study-note-pdf-retry" data-onclick="retryStudyNotePdfPreview('+Number(a.id)+')">미리보기 열기</button></div></div>';
            });
            return;
           }
           """
          text=text[:pos]+guard+text[pos:]

          text=text.replace(
              "setTimeout(()=>{void loadStudyNotePdfPreview(a,token);},30+delay);",
              "setTimeout(()=>{void loadStudyNotePdfPreview(a,token);},80+delay);",
              1
          )
          text=text.replace(
              "},{root:root||null,rootMargin:'280px 0px 360px 0px',threshold:.03});",
              "},{root:root||null,rootMargin:(window.innerWidth<768?'0px':'120px 0px 180px 0px'),threshold:.05});",
              1
          )
          text=text.replace(
              "const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,mobile?1.5:2));",
              "const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,mobile?1.1:2));",
              1
          )
          text=text.replace(
              "const maxSide=mobile?1800:2200,maxPx=mobile?2600000:4200000,long=Math.max(css.width,css.height);",
              "const maxSide=mobile?1400:2200,maxPx=mobile?1200000:4200000,long=Math.max(css.width,css.height);",
              1
          )
          p.write_text(text,encoding="utf-8")
          print("Applied V59 mobile PDF freeze fix")
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix PDF insertion freeze on mobile"
          git push origin main
