name: Deploy V76 hard sidebar integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-v76-hard-sidebar.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate sidebar JS
        run: node --check v75-feature-unify.js

      - name: Replace sidebar HTML directly
        shell: python
        env:
          V76_SIDEBAR_B64: 
        run: |
          from pathlib import Path
          import os, base64

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          needle='id="main-sidebar"'
          if s.count(needle) != 1:
              raise SystemExit(f"Expected one main-sidebar, got {s.count(needle)}")

          pos=s.index(needle)
          start=s.rfind("<aside ",0,pos)
          end=s.find("</aside>",pos)
          if start<0 or end<0:
              raise SystemExit("Sidebar bounds not found")
          end += len("</aside>")

          sidebar=base64.b64decode(os.environ["V76_SIDEBAR_B64"]).decode("utf-8")
          s=s[:start]+sidebar+s[end:]

          for old in ('?v=1','?v=2'):
              s=s.replace('./v75-feature-unify.css'+old,'./v75-feature-unify.css?v=3')
              s=s.replace('./v75-feature-unify.js'+old,'./v75-feature-unify.js?v=3')
          s=s.replace('./v75-feature-unify.css"','./v75-feature-unify.css?v=3"')
          s=s.replace('./v75-feature-unify.js"','./v75-feature-unify.js?v=3"')

          if 'data-v75-unified="1"' not in s:
              raise SystemExit("Static unified sidebar missing")
          if './v75-feature-unify.js?v=3' not in s:
              raise SystemExit("V75 JS v3 not linked")
          if not s.rstrip().endswith("</html>"):
              raise SystemExit("HTML ending broken")

          p.write_text(s,encoding="utf-8")

      - name: Commit V76
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy V76 static unified sidebar"
          git push origin main
