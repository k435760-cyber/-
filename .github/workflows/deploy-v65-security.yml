name: Deploy V65 security hardening
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-v65-security.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v65.py
          python /tmp/patch_v65.py
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          i=s.find('V65-security-hardening')
          a=s.rfind('<script',0,i)
          a=s.find('>',a)+1
          b=s.find('</script>',i)
          Path('/tmp/v65-parser.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/v65-parser.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden CSP and event parser V65"
          git push origin main
