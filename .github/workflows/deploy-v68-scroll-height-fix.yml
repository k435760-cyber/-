name: Deploy V68 scroll height fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-v68-scroll-height-fix.yml"
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if "./v68-scroll-height-fix.css" not in s:
              s=s.replace("</head>", '<link rel="stylesheet" href="./v68-scroll-height-fix.css">\n</head>', 1)
          if not s.rstrip().endswith("</html>"):
              raise SystemExit("broken HTML")
          p.write_text(s,encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy V68 excessive scroll fix"
          git push origin main
