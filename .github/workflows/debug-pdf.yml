name: Debug PDF code
on:
  push:
    branches: [debug-pdf-1788089712144]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print targeted PDF code context
        shell: python
        run: |
          from pathlib import Path
          text=Path("index.html").read_text(encoding="utf-8", errors="replace")
          pats=["studyNotePdf","PDF 연결 중","PDF 삽입 완료","ensurePdfJs","studyNoteInsert","insertPdf","pdf-preview"]
          spans=[]
          for p in pats:
            start=0
            while True:
              i=text.lower().find(p.lower(), start)
              if i<0: break
              spans.append((max(0,i-2600), min(len(text), i+5200), p, i))
              start=i+len(p)
          spans.sort()
          merged=[]
          for a,b,p,i in spans:
            if merged and a<=merged[-1][1]:
              merged[-1][1]=max(merged[-1][1],b)
              merged[-1][2].append(p)
            else:
              merged.append([a,b,[p]])
          for n,(a,b,ps) in enumerate(merged[:20],1):
            print(f"\n===== BLOCK {n} patterns={sorted(set(ps))} chars={a}:{b} =====\n")
            print(text[a:b])
