name: Debug PDF layout
on:
  push:
    branches: [debug-pdf-1788089712144]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print PDF layout CSS and markup
        shell: python
        run: |
          from pathlib import Path
          text=Path("index.html").read_text(encoding="utf-8",errors="replace")
          pats=[
            "study-note-footer",
            "study-note-toolbar",
            "study-note-head",
            "study-note-editor-shell",
            "study-note-paper",
            "study-note-edit-wrap",
            "study-note-pdf-list",
            "has-pdf",
            "position:fixed",
            "position:sticky"
          ]
          spans=[]
          for pat in pats:
            start=0
            while True:
              i=text.find(pat,start)
              if i<0: break
              spans.append((max(0,i-1800),min(len(text),i+3800),pat))
              start=i+len(pat)
          spans.sort()
          merged=[]
          for a,b,p in spans:
            if merged and a<=merged[-1][1]:
              merged[-1][1]=max(merged[-1][1],b); merged[-1][2].append(p)
            else:
              merged.append([a,b,[p]])
          for n,(a,b,ps) in enumerate(merged[:30],1):
            print(f"\n===== BLOCK {n} {sorted(set(ps))} =====\n")
            print(text[a:b])
