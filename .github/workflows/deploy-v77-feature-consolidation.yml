name: Deploy V77 deep feature consolidation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-v77-feature-consolidation.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate V77 assets
        run: |
          node --check v75-feature-unify.js
          node --check v77-feature-consolidate.js
          test -s v77-feature-consolidate.css

      - name: Consolidate navigation
        shell: python
        env:
          V77_SIDEBAR_B64: 
        run: |
          from pathlib import Path
          import base64, os

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          needle='id="main-sidebar"'
          if s.count(needle) != 1:
              raise SystemExit(f"Expected one main-sidebar, got {s.count(needle)}")

          pos=s.index(needle)
          start=s.rfind("<aside ",0,pos)
          end=s.find("</aside>",pos)
          if start<0 or end<0:
              raise SystemExit("Sidebar bounds not found")
          end += len("</aside>")

          sidebar=base64.b64decode(os.environ["V77_SIDEBAR_B64"]).decode("utf-8")
          s=s[:start]+sidebar+s[end:]

          css='<link rel="stylesheet" href="./v77-feature-consolidate.css?v=1">'
          js='<script src="./v77-feature-consolidate.js?v=1" defer></script>'
          if css not in s:
              s=s.replace("</head>",css+"\n</head>",1)
          if js not in s:
              s=s.replace("</body>",js+"\n</body>",1)

          for old in ('?v=1','?v=2','?v=3'):
              s=s.replace('./v75-feature-unify.css'+old,'./v75-feature-unify.css?v=4')
              s=s.replace('./v75-feature-unify.js'+old,'./v75-feature-unify.js?v=4')
          s=s.replace('./v75-feature-unify.css"','./v75-feature-unify.css?v=4"')
          s=s.replace('./v75-feature-unify.js"','./v75-feature-unify.js?v=4"')

          if 'data-v77-unified="1"' not in s:
              raise SystemExit("V77 sidebar missing")
          if s.count('data-v77-group=') != 4:
              raise SystemExit("Unexpected V77 group count")
          if './v77-feature-consolidate.js?v=1' not in s:
              raise SystemExit("V77 JS missing")
          if "https://dbneonomwrqwlbitwdtr.supabase.co" not in s:
              raise SystemExit("Supabase origin missing")
          if not s.rstrip().endswith("</html>"):
              raise SystemExit("HTML ending broken")

          p.write_text(s,encoding="utf-8")

      - name: Commit V77
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy V77 deep feature consolidation"
          git push origin main
