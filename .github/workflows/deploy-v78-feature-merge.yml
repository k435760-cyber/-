name: Deploy V78 actual feature merge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-v78-feature-merge.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate V78 assets
        run: |
          node --check v78-feature-merge.js
          test -s v78-feature-merge.css
          test -s v78-feature-merge.js

      - name: Replace old menu experiments and merge features
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          needle='id="main-sidebar"'
          if s.count(needle) != 1:
              raise SystemExit(f"Expected one main-sidebar, got {s.count(needle)}")

          pos=s.index(needle)
          start=s.rfind("<aside ",0,pos)
          end=s.find("</aside>",pos)
          if start<0 or end<0:
              raise SystemExit("Sidebar bounds not found")
          end += len("</aside>")

          sidebar=Path("v78-sidebar.html").read_text(encoding="utf-8")
          s=s[:start]+sidebar+s[end:]

          # V75/V77 were menu-only experiments. V78 replaces them completely.
          patterns=[
              r'\s*<link rel="stylesheet" href="\./v75-feature-unify\.css[^"]*">\s*',
              r'\s*<script src="\./v75-feature-unify\.js[^"]*" defer></script>\s*',
              r'\s*<link rel="stylesheet" href="\./v77-feature-consolidate\.css[^"]*">\s*',
              r'\s*<script src="\./v77-feature-consolidate\.js[^"]*" defer></script>\s*',
          ]
          for pat in patterns:
              s=re.sub(pat,'\n',s)

          css='<link rel="stylesheet" href="./v78-feature-merge.css?v=1">'
          js='<script src="./v78-feature-merge.js?v=1" defer></script>'
          if css not in s:
              s=s.replace("</head>",css+"\n</head>",1)
          if js not in s:
              s=s.replace("</body>",js+"\n</body>",1)

          if 'data-v78-unified="1"' not in s:
              raise SystemExit("V78 sidebar missing")
          if s.count('data-v78-group=') != 4:
              raise SystemExit("Unexpected V78 group count")
          if 'v75-feature-unify.js' in s or 'v77-feature-consolidate.js' in s:
              raise SystemExit("Old menu JS still linked")
          if './v78-feature-merge.js?v=1' not in s:
              raise SystemExit("V78 JS missing")
          if './v74-scroll-clean.css' not in s:
              raise SystemExit("V74 clean scroll base missing")
          if './v74-pdf-ui-scroll-fix.js' not in s:
              raise SystemExit("PDF fix missing")
          if "https://dbneonomwrqwlbitwdtr.supabase.co" not in s:
              raise SystemExit("Supabase origin missing")
          if not s.rstrip().endswith("</html>"):
              raise SystemExit("HTML ending broken")

          p.write_text(s,encoding="utf-8")

      - name: Commit V78
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy V78 actual feature merge"
          git push origin main
